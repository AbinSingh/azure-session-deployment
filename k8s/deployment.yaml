apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-api
  namespace: session-app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: session-api

  template:
    metadata:
      labels:
        app: session-api

    spec:
      containers:
        - name: session-api

          image: akspracticeacr26abin.azurecr.io/session-api:v2

          ports:
            - containerPort: 8000

          env:
            - name: REDIS_HOST
              value: "aks-practice-redis.eastus.redis.azure.net"

            - name: REDIS_PORT
              value: "10000"

            - name: REDIS_SSL
              value: "true"

            - name: REDIS_DB
              value: "0"

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PASSWORD